<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Flutter sustituye este valor con --base-href durante la compilación.
    Si se publica en una subcarpeta, indicar su ruta con barras al inicio y final.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ExploraEC: práctica de widgets y navegación del curso CEDIA MOD3.">

  <!-- Metadatos e iconos para iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ExploraEC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Icono del navegador -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ExploraEC</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    El SDK genera flutter_bootstrap.js al ejecutar o compilar esta aplicación.

</html>
