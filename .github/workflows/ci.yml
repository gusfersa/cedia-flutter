name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
          package-manager-cache: false
      - name: Versiones
        run: |
          flutter --version
          java -version
          node --version
      - name: Dependencias bloqueadas
        run: flutter pub get --enforce-lockfile
      - name: Análisis estático
        run: flutter analyze --no-pub
      - name: Suite Flutter ChefCraft
        run: flutter test --no-pub --reporter expanded test/chefcraft_test.dart
      - name: Suite Node ChefCraft
        run: node --test server/test/server.test.js
